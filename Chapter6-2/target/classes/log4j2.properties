# Give the configuration a name
name=PropertiesConfig

# Define the destinations for the logs (appenders).
# We'll use the console and a rolling file.
appenders=console, rolling

# Console Appender Configuration
appender.console.type=Console
appender.console.name=STDOUT
appender.console.layout.type=PatternLayout
appender.console.layout.pattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

# Rolling File Appender Configuration (logs to a file)
appender.rolling.type=RollingFile
appender.rolling.name=RollingFile
appender.rolling.fileName=logs/app.log
appender.rolling.filePattern=logs/app-%d{MM-dd-yyyy}.log.gz
appender.rolling.layout.type=PatternLayout
appender.rolling.layout.pattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n
appender.rolling.policies.type=Policies
appender.rolling.policies.time.type=TimeBasedTriggeringPolicy
appender.rolling.strategy.type=DefaultRolloverStrategy
appender.rolling.strategy.max=5

# Define the root logger level and which appenders to use
loggers=rolling
# This is the corrected configuration
logger.rolling.name=se233.chapter2
logger.rolling.level=info
logger.rolling.appenderRefs=rolling
logger.rolling.appenderRef.rolling.ref=RollingFile

rootLogger.level=info
rootLogger.appenderRefs=stdout
rootLogger.appenderRef.stdout.ref=STDOUT